<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background Calendar Card -->
  <g>
    <!-- Calendar Shadow -->
    <path d="M 14 18 L 40 12 L 43 46 L 17 52 Z" fill="#e4e0f2" />
    
    <!-- Calendar Body -->
    <rect x="11" y="12" width="28" height="36" rx="4" fill="#ffffff" stroke="#352953" stroke-width="2" stroke-linejoin="round" transform="rotate(-8 25 30)"/>
    
    <!-- Calendar Top Bar -->
    <path d="M 8.5 15 C 8 13.5 9.2 12 10.8 11.7 L 34.5 8.4 C 36 8.2 37.3 9.3 37.5 10.8 L 38.5 17.5 L 9.5 21.5 Z" fill="#7c69ef" stroke="#352953" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Rings -->
    <rect x="15" y="6" width="3.5" height="7" rx="1.7" fill="#ffffff" stroke="#352953" stroke-width="1.5" />
    <rect x="28" y="4.2" width="3.5" height="7" rx="1.7" fill="#ffffff" stroke="#352953" stroke-width="1.5" />
    
    <!-- Date Number 15 -->
    <circle cx="24" cy="33" r="6.5" fill="#f2eefa" />
    <text x="24" y="36.5" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="9" fill="#6366f1" text-anchor="middle">15</text>
  </g>

  <!-- Foreground Event Ticket -->
  <g>
    <!-- Ticket Shadow -->
    <path d="M 22 28 L 56 21 L 53 53 L 19 60 Z" fill="#d8d2ed" />
    
    <!-- Ticket Body -->
    <path d="M 20 26 
             C 20 26, 35 23, 54 19 
             C 56 18.6, 57.5 19.8, 57.8 21.5 
             L 55 34.5 
             C 52.5 35.2, 51.5 38.5, 53.5 40.5 
             L 51.5 51.5 
             C 51.2 53.2, 49.5 54.5, 47.8 54.8 
             L 29 58.5 
             C 27.3 58.8, 25.8 57.6, 25.5 55.8 
             L 26.5 46 
             C 28.5 44, 27.5 40.8, 25 40 
             Z" 
          fill="#ffffff" stroke="#352953" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Stub perforation line -->
    <line x1="32" y1="23.5" x2="29" y2="55.5" stroke="#7c69ef" stroke-width="1.5" stroke-dasharray="2 2" />
    
    <!-- Star Emblem on Ticket -->
    <path d="M 42 30 L 43.6 33.3 L 47.2 33.8 L 44.6 36.3 L 45.2 39.9 L 42 38.2 L 38.8 39.9 L 39.4 36.3 L 36.8 33.8 L 40.4 33.3 Z" 
          fill="#ffb703" stroke="#352953" stroke-width="1.5" stroke-linejoin="round" />
  </g>
  
  <!-- Sparkles Top Right -->
  <path d="M 51 7 L 52.2 10.2 L 55.4 11.4 L 52.2 12.6 L 51 15.8 L 49.8 12.6 L 46.6 11.4 L 49.8 10.2 Z" fill="#ffb703" stroke="#352953" stroke-width="1.2" stroke-linejoin="round" />
  <circle cx="58" cy="15" r="1.8" fill="#7c69ef" />
</svg>